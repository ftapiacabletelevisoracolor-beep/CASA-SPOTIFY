<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Control remoto</title>
<style>
  :root{ --accent:#1DB954; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#0b0d10; color:#f2f2f2;
    font-family:'Segoe UI', system-ui, sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:24px; gap:20px;
  }
  h1{font-size:1.3rem; margin:8px 0 0 0;}
  #status{color:#9aa0a6; font-size:0.85rem; text-align:center;}
  #connect{
    background:var(--accent); color:#000; border:none; padding:16px 28px;
    border-radius:30px; font-size:1.1rem; font-weight:700;
  }
  .grid{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; width:100%; max-width:420px;
  }
  .btn{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    color:#fff; border-radius:18px; padding:22px 0; font-size:1.6rem; text-align:center;
  }
  .btn.wide{ grid-column: span 3; font-size:1.1rem; }
  .vol{ display:flex; gap:14px; width:100%; max-width:420px; }
  .vol .btn{ flex:1; }
  #now{
    text-align:center; min-height:50px;
  }
  #now .track{font-weight:600; font-size:1.1rem;}
  #now .artist{color:#9aa0a6; font-size:0.9rem;}
</style>
</head>
<body>
  <h1>🎛️ Control remoto</h1>
  <div id="now"><div class="track">—</div><div class="artist"></div></div>

  <div id="logged-out">
    <button id="connect">Conectar con Spotify</button>
    <div id="status"></div>
  </div>

  <div id="logged-in" style="display:none; width:100%; display:flex; flex-direction:column; align-items:center; gap:16px;">
    <div class="grid">
      <div class="btn" onclick="ctrl('previous','POST')">⏮</div>
      <div class="btn" onclick="togglePlay()">⏯</div>
      <div class="btn" onclick="ctrl('next','POST')">⏭</div>
    </div>
    <div class="vol">
      <div class="btn" onclick="vol(-15)">🔉 −</div>
      <div class="btn" onclick="vol(15)">🔊 +</div>
    </div>
  </div>

<script>
// IMPORTANTE: mismo CLIENT_ID que en index.html
const CLIENT_ID = "487a3b1ad5694d81b713596de6309a73";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "user-read-currently-playing user-read-playback-state user-modify-playback-state";

let token = null, expiresAt = 0, isPlaying = false;

function base64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256(s){ return await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); }
function randomString(len=64){
  const arr = new Uint8Array(len); crypto.getRandomValues(arr);
  return Array.from(arr, b=>('0'+(b%36).toString(36)).slice(-1)).join('');
}

async function login(){
  const verifier = randomString(64);
  sessionStorage.setItem('c_verifier', verifier);
  const challenge = base64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID, response_type:'code', redirect_uri: REDIRECT_URI,
    code_challenge_method:'S256', code_challenge: challenge, scope: SCOPES
  });
  window.location = `https://accounts.spotify.com/authorize?${params}`;
}

async function exchangeCode(code){
  const verifier = sessionStorage.getItem('c_verifier');
  const body = new URLSearchParams({
    client_id: CLIENT_ID, grant_type:'authorization_code', code,
    redirect_uri: REDIRECT_URI, code_verifier: verifier
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body
  });
  const data = await res.json();
  if(data.access_token){
    token = data.access_token; expiresAt = Date.now() + data.expires_in*1000;
    sessionStorage.setItem('c_refresh', data.refresh_token || '');
    showLoggedIn();
    poll();
  }
}

async function refresh(){
  const rt = sessionStorage.getItem('c_refresh');
  if(!rt) return false;
  const body = new URLSearchParams({ client_id: CLIENT_ID, grant_type:'refresh_token', refresh_token: rt });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body
  });
  const data = await res.json();
  if(data.access_token){ token = data.access_token; expiresAt = Date.now()+data.expires_in*1000; return true; }
  return false;
}

function showLoggedIn(){
  document.getElementById('logged-out').style.display='none';
  document.getElementById('logged-in').style.display='flex';
}

async function ensureToken(){
  if(Date.now() > expiresAt - 5000) await refresh();
}

async function ctrl(endpoint, method, qs=''){
  await ensureToken();
  await fetch(`https://api.spotify.com/v1/me/player/${endpoint}${qs}`, {
    method, headers:{ Authorization:`Bearer ${token}` }
  });
  setTimeout(poll, 500);
}

async function togglePlay(){
  ctrl(isPlaying ? 'pause' : 'play', 'PUT');
}

async function vol(delta){
  await ensureToken();
  const res = await fetch('https://api.spotify.com/v1/me/player', { headers:{ Authorization:`Bearer ${token}` } });
  if(res.status !== 200) return;
  const data = await res.json();
  const current = data?.device?.volume_percent ?? 50;
  const next = Math.max(0, Math.min(100, current+delta));
  await ctrl('volume', 'PUT', `?volume_percent=${next}`);
}

async function poll(){
  await ensureToken();
  try{
    const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
      headers:{ Authorization:`Bearer ${token}` }
    });
    if(res.status === 204){
      document.querySelector('#now .track').textContent = "Nada sonando";
      document.querySelector('#now .artist').textContent = "";
      isPlaying = false;
      return;
    }
    const data = await res.json();
    if(data && data.item){
      document.querySelector('#now .track').textContent = data.item.name;
      document.querySelector('#now .artist').textContent = data.item.artists.map(a=>a.name).join(', ');
      isPlaying = data.is_playing;
    }
  }catch(e){}
}
setInterval(poll, 4000);

document.getElementById('connect').addEventListener('click', login);

(function init(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if(code){
    window.history.replaceState({}, document.title, window.location.pathname);
    exchangeCode(code);
  }
})();
</script>
</body>
</html>
